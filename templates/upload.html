{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <div class="card bg-dark text-white border-secondary p-4 shadow-lg mx-auto" style="max-width: 600px;">
    <h4 class="fw-bold text-warning mb-2"><i class="fa-solid fa-file-excel me-2"></i> IT Excel Data Importer Portal</h4>
    <p class="text-muted small mb-4">Upload daily showroom Excel sheets. SQL Database will automatically update without rebooting the system.</p>

    <form action="/upload-excel" method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Data Module Type</label>
        <select name="data_type" class="form-select bg-secondary text-white border-0" required>
          <option value="items">Showroom Assets & Stock Items</option>
          <option value="expenses">Daily Expenses (Kharcha Log)</option>
          <option value="transfers">Stock Transfers (In / Out Log)</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label">Upload Excel File (.xlsx, .csv)</label>
        <input type="file" name="excel_file" class="form-control bg-secondary text-white border-0" accept=".xlsx, .xls, .csv" required>
      </div>

      <button type="submit" class="btn btn-warning fw-bold w-100 py-2">Import & Sync SQL Database</button>
    </form>
  </div>
</div>
{% endblock %}
