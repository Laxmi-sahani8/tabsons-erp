<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tabsons Logistics Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: white; }
    .card { background-color: #1c2541; border: 1px solid #334155; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
  <div class="card p-4 shadow-lg style="width: 100%; max-width: 400px;"">
    <h3 class="text-center text-warning fw-bold mb-1">TABSONS LOGISTICS</h3>
    <p class="text-center text-muted small mb-4">Enterprise Management System</p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} p-2 small text-center">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
      <div class="mb-3">
        <label class="form-label small">Email</label>
        <input type="email" name="email" class="form-control bg-dark text-white border-secondary" value="it@tabsons.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label small">Password</label>
        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" value="tabsons123" required>
      </div>
      <button type="submit" class="btn btn-warning fw-bold w-100">Login</button>
    </form>
  </div>
</body>
</html>
